[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "starlette-ai-chatbot"
version = "1.0.0"
description = "Adds the Asyntai AI chat assistant to Starlette and FastAPI sites. It answers visitor questions from your own content, in more than 80 languages."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Asyntai", email = "hello@asyntai.com" }]
keywords = ["starlette", "fastapi", "asgi", "middleware", "chatbot", "ai", "ai-chatbot", "live-chat", "customer-support", "widget"]
dependencies = ["starlette>=0.27"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
]

[project.urls]
Homepage = "https://asyntai.com"
Documentation = "https://asyntai.com/documentation/integrations/starlette/"
Source = "https://github.com/asyntai/starlette-ai-chatbot"
Issues = "https://github.com/asyntai/starlette-ai-chatbot/issues"

[tool.setuptools.packages.find]
where = ["src"]
