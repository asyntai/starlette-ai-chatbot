name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            deps: "starlette==0.27.* "httpx<0.28" jinja2"
          - python: "3.10"
            deps: "fastapi==0.110.* "httpx<0.28" jinja2"
          - python: "3.13"
            deps: "fastapi httpx jinja2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install ${{ matrix.deps }} pytest
      - run: pip install -e .
      - run: python -m pytest -q
